name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python errors and unused imports
        run: python -m ruff check --isolated --select E4,E7,E9,F src tests scripts examples
      - name: Test
        run: python -m pytest -q
      - name: Build wheel from source distribution
        run: python -m build
      - name: Verify package metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv .wheel-test
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            test_python=".wheel-test/Scripts/python.exe"
          else
            test_python=".wheel-test/bin/python"
          fi
          "$test_python" -I -m pip install --no-index --no-deps dist/*.whl
          "$test_python" -I -m pip check
          "$test_python" -I scripts/smoke_test.py
