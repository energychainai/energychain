name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Scan tracked files and history for common credentials
        run: python scripts/check_public_release.py --history
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python errors and unused imports
        run: python -m ruff check --isolated --select E4,E7,E9,F src tests scripts examples
      - name: Test
        run: python -m pytest -q
      - name: Build wheel from source distribution
        run: python -m build
      - name: Verify package metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv .wheel-test
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            test_python=".wheel-test/Scripts/python.exe"
          else
            test_python=".wheel-test/bin/python"
          fi
          "$test_python" -I -m pip install --no-index --no-deps dist/*.whl
          "$test_python" -I -m pip check
          "$test_python" -I scripts/smoke_test.py
