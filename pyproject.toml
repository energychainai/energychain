[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energychain"
version = "0.3.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Composable, safety-first Python framework for AI-native energy applications"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EnergyChain Contributors"}]
keywords = ["energy", "solar", "battery", "AI", "agents", "energychain", "SDK"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Scientific/Engineering", "Topic :: Software Development :: Libraries :: Python Modules"]

[project.optional-dependencies]
models = ["jsonschema>=4.23,<5"]
documents = ["pypdf>=5,<8", "python-docx>=1.2,<2", "openpyxl>=3.1,<4"]
all = ["jsonschema>=4.23,<5", "pypdf>=5,<8", "python-docx>=1.2,<2", "openpyxl>=3.1,<4"]
dev = ["pytest>=8", "build>=1", "twine>=5", "ruff>=0.6", "jsonschema>=4.23,<5",
       "pypdf>=5,<8", "python-docx>=1.2,<2", "openpyxl>=3.1,<4"]

[project.urls]
Homepage = "https://energychain-plum.vercel.app/"
Documentation = "https://energychain-plum.vercel.app/docs/"
Source = "https://github.com/Atanseiye/energychain"
Issues = "https://github.com/Atanseiye/energychain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
